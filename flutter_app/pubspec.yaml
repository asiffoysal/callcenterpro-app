name: callcenterpro
description: CallCenter Pro agent app (Android, iOS, Windows, macOS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  sip_ua: ^1.1.0            # SIP over WSS to the call engine (pulls flutter_webrtc itself)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
