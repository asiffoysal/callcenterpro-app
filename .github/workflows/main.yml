name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.callcenterpro --project-name callcenterpro --platforms=android .
      - name: Add calling permissions to Android manifest
        run: |
          python3 - android/app/src/main/AndroidManifest.xml <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH"/>\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
          )
          if 'RECORD_AUDIO' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, s, count=1)
              open(p, 'w').write(s)
              print("permissions added")
          else:
              print("permissions already present")
          PY
      - run: flutter pub get
      # Per-CPU APKs: each is ~half the size of a universal one. Install the
      # arm64-v8a build on modern phones.
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: callcenterpro-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-*-release.apk
